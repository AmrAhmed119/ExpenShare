micronaut:
  application:
    name: expen-share
  server:
    port: 8080

datasources:
  default:
    db-type: mysql
    url: jdbc:mysql://localhost:3306/expenshare?useSSL=false&serverTimezone=UTC
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: pw123

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: none
        show_sql: true
        format_sql: true

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration

kafka:
  bootstrap:
    servers: localhost:9092